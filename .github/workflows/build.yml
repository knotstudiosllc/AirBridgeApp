name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # AirBridge.csproj references ..\RtkIhv\RtkIhv.csproj, so both repos are
      # checked out side by side, the same way they sit on disk locally.
      - name: Check out AirBridgeApp
        uses: actions/checkout@v4
        with:
          path: AirBridgeApp

      # RtkIhv lives in its own repo. Set the RTKIHV_REPO variable if it is not
      # <owner>/RtkIhv, and the RTKIHV_TOKEN secret if that repo is private.
      # A branch that exists in both repos builds against RtkIhv's copy of it, so
      # a change split across the two repos builds before either is merged.
      - name: Pick RtkIhv branch
        id: rtkihv
        shell: pwsh
        env:
          REPO: ${{ vars.RTKIHV_REPO || format('{0}/RtkIhv', github.repository_owner) }}
          TOKEN: ${{ secrets.RTKIHV_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $ref = ''
          if ($env:GITHUB_REF_TYPE -ne 'tag' -and (git ls-remote --heads "https://x-access-token:$env:TOKEN@github.com/$env:REPO" "refs/heads/$env:BRANCH")) { $ref = $env:BRANCH }
          Write-Host "RtkIhv ref: $(if ($ref) { $ref } else { '(default branch)' })"
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Check out RtkIhv
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RTKIHV_REPO || format('{0}/RtkIhv', github.repository_owner) }}
          ref: ${{ steps.rtkihv.outputs.ref }}
          token: ${{ secrets.RTKIHV_TOKEN || github.token }}
          path: RtkIhv

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pick version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $t = $env:GITHUB_REF_NAME; $v = $t.TrimStart('v') }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER"; $t = "v$v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$t" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore AirBridgeApp/AirBridge.csproj

      - name: Build
        run: dotnet build AirBridgeApp/AirBridge.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      # Self-contained single-file win-x64 settings come from AirBridge.csproj.
      - name: Publish
        run: dotnet publish AirBridgeApp/AirBridge.csproj -c Release --no-restore -o out -p:Version=${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: AirBridge-${{ steps.ver.outputs.version }}
          path: out/AirBridge.exe
          if-no-files-found: error

      # Every push publishes a release. A pushed v* tag uses that tag; any other push
      # tags v1.0.<run number> at the built commit. Builds off any branch but master or main are pre-releases.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        working-directory: AirBridgeApp
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG ../out/AirBridge.exe --clobber
          } else {
            $extra = @()
            if ($env:GITHUB_REF_TYPE -ne 'tag' -and $env:GITHUB_REF_NAME -notin 'master', 'main') { $extra += '--prerelease' }
            gh release create $env:TAG ../out/AirBridge.exe --target $env:GITHUB_SHA --title "Air Bridge $env:TAG" --generate-notes @extra
          }
